# ============================================================
#  MkDocs 站点配置 —— 个人经验知识库
#  文档：https://squidfunk.github.io/mkdocs-material/setup/
# ============================================================

# ---- 基本信息 ----
site_name: Digital Know-How
site_description: 66WDO 的个人数码经验集：电脑装机、外设、网络组网、HiFi 音频……
site_author: 66WDO
# site_url 决定每个页面的 canonical 链接与 sitemap.xml（不设则两者都缺失/为空），
# 且必须和 GitHub Pages 实际部署地址完全一致：
#   · 用户/组织站（推荐，仓库名就是 <用户名>.github.io，部署在根域名）：
#       https://<用户名>.github.io/
#   · 项目站（部署在子路径）：
#       https://<用户名>.github.io/<仓库名>/
# 下面为占位地址：部署前把 your-github-username 换成真实用户名（项目站再补仓库子路径）。
# MkDocs 会依据 site_url 自动给全站链接（含 404 页、静态资源）加正确前缀，
# 因此子路径项目站也不会出现“/ 开头链接跑到域名根、路径跑歪”的问题。
site_url: https://66wdo.github.io/digital-handbook/
repo_url: https://github.com/66wdo/digital-handbook
repo_name: digital-handbook
docs_dir: docs
site_dir: site

# 页脚版权声明（HTML 原样输出）
copyright: >-
  本站内容由 66WDO 创作，采用
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans"
  target="_blank" rel="license noopener">CC BY-NC-SA 4.0</a>
  协议授权（署名-非商业性使用-相同方式共享）。

# ---- 主题 ----
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false                 # 使用系统字体，国内打开更快、离线也能构建
  favicon: assets/favicon.svg
  features:
    - navigation.tabs         # 顶部一级导航
    - navigation.tabs.sticky
    - navigation.sections     # 侧边栏分组
    - navigation.indexes      # 分类首页
    - navigation.top          # 回到顶部按钮
    - navigation.footer       # 上一页/下一页
    - navigation.instant      # 类 SPA，切换页面不刷新
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy       # 代码块一键复制
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

# ---- 插件 ----
plugins:
  - search
  - section-index
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true
      timezone: Asia/Shanghai
      locale: zh
  - minify:
      minify_html: true

# ---- Markdown 扩展（支持提示框、标签页、任务清单、表格等）----
markdown_extensions:
  - md_in_html
  - abbr
  - attr_list
  - def_list
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 4
      slugify:
        !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js
  - assets/javascripts/interactive-diagram.js

# ---- 导航结构（新增文章后，在这里登记即会出现在菜单里）----
