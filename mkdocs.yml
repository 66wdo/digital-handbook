# ============================================================
#  MkDocs 站点配置 —— 个人经验知识库
#  文档：https://squidfunk.github.io/mkdocs-material/setup/
# ============================================================

# ---- 基本信息（创建 GitHub 仓库后，把 repo_url 改成你的地址）----
site_name: 我的经验知识库
site_description: 个人跨领域经验整理：手机选购、电脑装机、外设、HiFi 音频、游戏攻略……
site_author: 待填写
# repo_url: https://github.com/你的用户名/你的仓库名
# repo_name: GitHub
docs_dir: docs
site_dir: site

# ---- 主题 ----
theme:
  name: material
  language: zh
  font: false                 # 使用系统字体，国内打开更快、离线也能构建
  features:
    - navigation.tabs         # 顶部一级导航
    - navigation.tabs.sticky
    - navigation.sections     # 侧边栏分组
    - navigation.indexes      # 分类首页
    - navigation.top          # 回到顶部按钮
    - navigation.footer       # 上一页/下一页
    - navigation.instant      # 类 SPA，切换页面不刷新
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy       # 代码块一键复制
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

# ---- 插件 ----
plugins:
  - search
  - section-index
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true
      timezone: Asia/Shanghai
      locale: zh
  - minify:
      minify_html: true

# ---- Markdown 扩展（支持提示框、标签页、任务清单、表格等）----
markdown_extensions:
  - md_in_html
  - abbr
  - attr_list
  - def_list
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 4
      slugify:
        !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

# ---- 导航结构（新增文章后，在这里登记即会出现在菜单里）----
nav:
  - 首页: index.md
  - 手机选购:
    - 数码/手机/index.md
    - 选购总览：需求与预算: 数码/手机/选购总览-需求与预算.md
    - 关键参数怎么看: 数码/手机/关键参数怎么看.md
    - 品牌与机型认识: 数码/手机/品牌与机型认识.md
  - 电脑:
    - 数码/装机/index.md
    - 硬件怎么选: 数码/装机/硬件怎么选.md
    - 装机流程指南: 数码/装机/装机流程指南.md
    - 点亮与故障排查: 数码/装机/点亮与故障排查.md
  - 外设:
    - 数码/外设/index.md
    - 键盘：机械轴与磁轴: 数码/外设/键盘-机械轴与磁轴.md
    - 鼠标与微动: 数码/外设/鼠标与微动.md
    - 显示器与刷新率: 数码/外设/显示器与刷新率.md
  - 音频与 HiFi:
    - 数码/音频与HiFi/index.md
    - 耳机、音箱与解码耳放: 数码/音频与HiFi/耳机音箱与解码耳放.md
    - 监听与功能挑选: 数码/音频与HiFi/监听与功能挑选.md
  - 游戏攻略:
    - 游戏攻略/index.md
  - 写作指南: 写作指南.md
